<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Activity 7</title>
</head>

   <style>


          body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(194, 210, 225);
            margin: 0;
            text-align: center;
            padding-top: 50px;

        }

        .name{

            font-family: Arial, Helvetica, sans-serif;
            font-size: 50px;
            text-align: center;
            color: orange;
            padding: 8px;
            margin: 5px;
        }

        .Title{
            font-family: Arial, Helvetica, sans-serif;
            
            font-size: 50px;
            text-align: center;
            color: rgb(25, 89, 24);
            padding: 8px;
            margin: 18px;


        }

     button{
            background-color: rgb(138, 200, 247);
            color: rgb(252, 252, 252);
            border: none;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
            padding: 12px 20px;
            transition: all 0.5s ease-in-out;
            box-shadow: 0 4px 10px gray;
            margin-top: 0;
        }

        button:hover{
                background-color: rgb(241, 67, 52);
                transform:  scale(1.80);
                box-shadow: 0 6px 14px gray
                
        }

        .circle{
            width: 180px;
            height: 180px;
            padding: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            position: relative;
            left: 45%;
            cursor: pointer;
            color: white;
            background-color: rgb(206, 35, 23);
            box-shadow: 0 4px 10px gray;
            transition: all 0.5s ease-in-out;
            animation: upAndDown 1s ease-in-out infinite alternate;
        }

        @keyframes upAndDown {
            from { transform: translateY(-8px); }
            to { transform: translateY(240px); }
        }

        .circle:hover{
                background-color: rgb(82, 216, 216);
                transform: rotate(6deg) scale(1.20);
                box-shadow: 0 6px 14px gray
        }

    </style>


    <body>
        <div class="name"><b>Daniel Andrei S. Cayanan</b></div>
        <div class="Title"><b>CSS Transitions & Animations</b></div>

        <button> Hover Me! </button>

        <br><br><br><br><br>

        <div class="circle"></div>
        






    
    </body>
</html>
