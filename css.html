            <style>
                .btn{
                border: none;
                background-color: inherit;
                padding: 14px 28px;
                font-size: 18px;
                cursor: pointer;
                display: inline-block;
                }

                /* Green */
                .Profile{
                color: green;
                
                }

                .Profile:hover{
                    background-color: rgb(211, 44, 44);
                    color: rgb(197, 238, 12)

                }
                
                /* Blue */

                .About_Us{
                color: rgb(7, 3, 238);
                }

                .About_Us:hover{
                    background-color: rgb(218, 0, 247);
                    color: rgb(250, 245, 250)
                }

                /* Orange */

                .Contact_Us{
                color: rgb(238, 185, 9);
                }

                .Contact_Us:hover{
                    background-color: rgb(219, 187, 4);
                    color: rgb(250, 245, 250)
                    
                }

                 /* RED */

                .AUF_CSS{
                color: rgb(35, 54, 230);
                }

                .AUF_CSS:hover{
                    background-color: rgb(231, 231, 10);
                    color: rgb(245, 244, 241)
                    
                }               

                 /* Royal Blue */

                .Facebook{
                color: royalblue;
                }

                .Facebook:hover{
                    background-color: #4169E1;
                    color: rgb(245, 244, 241)
                    
                } 

            </style>
