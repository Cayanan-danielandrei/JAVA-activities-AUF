<!DOCTYPE html>
<html>
    <title> Circle Animation </title>

        <style>
            .circle{
                width: 200px;
                height: 200px;
                background-color: dodgerblue;
                margin: 50px auto;        
                border-radius: 50%;
                animation:pulse 2s infinite;
            }

            @keyframes pulse {
                0%, 100% { 
                    transform:scale(1); 
                    background-color: rgba(19, 110, 19, 0.856);
                }
                
                50% { 
                    transform:scale(1.3);
                    background-color: rgba(113, 216, 28, 0.856);
                }
                
            }
        </style>




     <body>
        <h1 align= center> Circle CSS animation</h1>
        <div class="circle"></div>
    </body>



</html>
