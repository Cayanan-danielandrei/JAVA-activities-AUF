<!DOCTYPE html>
<html>
    <head>
        <style>
            *{
                box-sizing: border-box;
            }

            .body{
                margin: 0;
                padding: 0;
            }
            header{
                background-color: silver;
                padding: 10px;
                text-align: center;
                position: sticky;
                font-family: Arial, Helvetica, sans-serif;
            }
            /*STYLE the top navigation bar*/
            ul.topnav{
                display: flex;
                list-style-type: none;
                margin: 0;
                padding: 0;
                background-color: rgb(8, 7, 8);
            }
            /* STYLE LINKS IN Topnav */
            ul.topnav li a{
                display: block;
                color: rgb(247, 246, 246);
                padding: 14px 16px;
                text-decoration: none;
            }

            /*CHANGE COLOR on hover button */
            ul.topnav li a:hover{
                background-color: rgb(201, 201, 117);
                color: rgb(2, 2, 2);
            }

        </style>
    </head>
    
    <body>
        <header>
            <h1>MY HEADER </h1>

        </header>
        <ul class="topnav">
            <li><a href="https://www.facebook.com">Home</a></li>
            <li><a href="#">News</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>




    </body>
</html>
