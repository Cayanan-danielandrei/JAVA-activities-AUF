<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Act 5</title>

</head>

    <style> 

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(199, 199, 199);
            margin: 0;
            min-height: 100svh;
            display:flex;
            justify-content: center;
            align-items:center

        }

        .name{
            font-family: Arial, Helvetica, sans-serif;
            font-style:italic;
            font-size:large;
            color: rgb(85, 84, 84);
            margin: 0;
            padding: 8px 15px;
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            
        }
        .title{
            font-family: Arial, Helvetica, sans-serif;
            font-style:italic;
            font-size:large;
            color: rgb(85, 84, 84);
            margin: 0;
            padding: 8px 15px;
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            
        }
        .rectangle{
            background-color: rgb(58, 141, 73);
            color: rgb(252, 252, 252);
            border: none;
            border-radius: 15px;
            width: 250px;
            height: 100px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position:fixed;
            left: 20%;
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            box-shadow: 0 4px 10px gray
        }

        .rectangle:hover{
                background-color: rgb(201, 42, 13);
                transform: rotate(6deg) scale(1.20);
                box-shadow: 0 6px 14px gray

        }

        .square{
            width: 110px;
            height: 110px;
            padding: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            position: relative;
            left: 25%;
            cursor: pointer;
            color: white;
            background-color: rgb(206, 35, 23);
            box-shadow: 0 4px 10px gray;
            transition: all 0.5s ease-in-out;
            animation: upAndDown 1s ease-in-out infinite alternate;
        }

        @keyframes upAndDown {
            from { transform: translateY(-20px); }
            to { transform: translateY(20px); }
        }

        .square:hover{
                background-color: rgb(82, 216, 216);
                transform: rotate(6deg) scale(1.20);
                box-shadow: 0 6px 14px gray

        }

    </style>
    


    <body>
        <p class="title"> Final Act 5</p>

        <div class="rectangle"> Rectangle </div>

        <p class="name"> Created by: Cayanan Daniel Andrei S.</p>

        <div class="square"> Square </div>



    </body>
</html>
