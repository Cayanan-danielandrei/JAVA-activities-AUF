<br> JAVASCRIPT CAN DISPLAY POSSIBILITIES
<br> JAVASCRIPT CAN DISPLAY DATA IN DIFFERENT WAYS:

<br>WRITING INTO AN HTML element using innerHTML or innerText
<br>WRITING INTO AN HTML output asd




<!DOCTYPE html>
<html lang="en">
    <title>Javascript</title>

    <body>
        <h1>My First Web Page Using JavaScript</h1>
        
        <p id="demoText"></p>  
        <p id="demoComp"></p>
        
        <button onclick="window.print()">Print This Page</button> <br> <br>

        <h2>JAVA SCRIPT can change HTML attribute values</h2>
        <button onclick="document.getElementById('image').src='lightbulbon.gif'">Turn on the light </button>
        <img id="image" src="lightbulboff.gif" style="width: 150px; height: 250px;">
        <button onclick="document.getElementById('image').src='lightbulboff.gif'">Turn off the light </button>

        <br>





        <script>
            document.getElementById("demoText").innerHTML = "<h2> Hello World !! </h2>"; // Calling of Text using innerHTML
            document.getElementById("demoComp").innerHTML = 40+40+40; // Computation
            document.write(20+20+20); // Direct Writing using java script
            console.log(40+40+40);// For F12 or Console
            //window.alert(40+40+40); < Line of Code // Window Alert or Pop up Window
            





        </script>



    </body>
</html>
