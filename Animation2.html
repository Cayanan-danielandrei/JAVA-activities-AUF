<!DOCTYPE html>
<html>
    <title> Dynamic Animation </title>

    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: dodgerblue;
            position: relative;
            animation-name: example;
            animation-duration: 1s;
        }


        @keyframes example {
            0% {background-color: lightblue; left: 0px; top:0px ;}
            25% {background-color: rgb(3, 3, 82); left: 500px; top:0px;}
            50% {background-color: rgb(17, 117, 218); left: 500px; top:500px;}            
            75% {background-color: rgb(7, 7, 104); left: 0px; top:500px;}           
            100% {background-color: lightblue; left: 0px; top:0px;} 

        }

    </style>

     <body>
        <h1>CSS Animation</h1>
        <div> BOX </div>
            






     </body>
</html>
