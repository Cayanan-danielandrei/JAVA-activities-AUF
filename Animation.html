    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: dodgerblue;
            animation-name: example;
            animation-duration: 2s;
        }

        @keyframes example {
            from {background-color: lightblue;}
            to {background-color: lightcoral;}
        }

    </style>
