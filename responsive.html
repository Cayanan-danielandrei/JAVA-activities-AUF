<!DOCTYPE html>
<html>
    <head>
        <body>
            <h2>RESPONSIVE IMAGE </h2>
            <p>max-width:100% prevents the image from getting bigger than its original size. 
               However if you make the browser window smaller, the image will still scale down 
            </p>

            <p>Resize the browser window to see the effect.</p>

            <img src="Cat2.jpg" style="max-width:100%; height:auto;" >
        </body>    
    </head>    

</html>
