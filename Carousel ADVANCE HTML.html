<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Carousel Example</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

  <h2 class="mb-4 text-center">My Bootstrap Carousel Example in CCS10</h2>

  <!-- Carousel -->
  <div id="exampleCarousel" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators (dots) -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#exampleCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="My First Slide"></button>
      <button type="button" data-bs-target="#exampleCarousel" data-bs-slide-to="1" aria-label="My Second Slide"></button>
      <button type="button" data-bs-target="#exampleCarousel" data-bs-slide-to="2" aria-label="My Third Slide"></button>
    </div>

    <!-- Carousel items -->
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/800/400?random=1" class="d-block w-100" alt="Slide 1">
        <div class="carousel-caption d-none d-md-block">
          <h5>My First Slide</h5>
          <p>This is a simple description for the first slide.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/800/400?random=2" class="d-block w-100" alt="Slide 2">
        <div class="carousel-caption d-none d-md-block">
          <h5>My Second Slide</h5>
          <p>Bootstrap carousels are great for showcasing images or products.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/800/400?random=3" class="d-block w-100" alt="Slide 3">
        <div class="carousel-caption d-none d-md-block">
          <h5>My Third Slide</h5>
          <p>Each slide can include captions, buttons, or other HTML elements.</p>
        </div>
      </div>
    </div>

    <!-- Controls (arrows) -->
    <button class="carousel-control-prev" type="button" data-bs-target="#exampleCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#exampleCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>

  </div>

  <!-- Bootstrap JS (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
