<!DOCTYPE html>
<html>
    <title> Tilt Box Animation </title>
        <style>
            .transition{
                width: 400px;
                height: 400px;
                padding: 20px;
                border: 10px;
                border-radius: 10px;
                margin: 30px auto;
                background-color: dodgerblue;
                font-style:italic;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                box-shadow: gray;
                transition: all 0.6s ease-in-out;
                border: 20px;
                
            }

            .transition:hover{
                background: pink;
                transform: rotate(3deg) scale(1.08);
                box-shadow: gray;

            }
        </style>




     <body>

        <div class="transition"> This is a sample text! </div>
   
     
    
    
    </body>



</html>
